<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순우리말 오방색 명함 메이커</title>
    <!-- Tailwind CSS 연동 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 연동 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- 명함 이미지 캡처를 위한 html2canvas 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .serif {
            font-family: 'Noto Serif KR', serif;
        }
        /* 카드 둥근 모서리 및 그림자 효과 */
        .business-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        /* 요소를 숨기기 위한 유틸리티 클래스 */
        .hidden-section {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gray-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold mb-2">나만의 한글 명함</h1>
            <p class="text-sm text-gray-300">이름과 생일을 입력하면 아름다운 순우리말과 오방색으로 명함을 만들어 드립니다.</p>
        </header>

        <!-- Input Section: 사용자 입력 폼 -->
        <div id="input-section" class="p-6">
            <!-- 이름 입력란 -->
            <div class="mb-4">
                <label for="userName" class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                <input type="text" id="userName" placeholder="예: 홍길동" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" autocomplete="off">
            </div>

            <!-- 월, 일 선택란 -->
            <div class="flex gap-4 mb-6">
                <div class="flex-1">
                    <label for="birthMonth" class="block text-sm font-medium text-gray-700 mb-1">태어난 월</label>
                    <select id="birthMonth" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                        <option value="" disabled selected>월 선택</option>
                        <!-- Options will be generated by JS -->
                    </select>
                </div>
                <div class="flex-1">
                    <label for="birthDay" class="block text-sm font-medium text-gray-700 mb-1">태어난 일</label>
                    <select id="birthDay" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                        <option value="" disabled selected>일 선택</option>
                        <!-- Options will be generated by JS -->
                    </select>
                </div>
            </div>

            <!-- 명함 생성 버튼 -->
            <button id="generateBtn" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md">
                명함 만들기
            </button>
        </div>

        <!-- Result Section: 완성된 명함 렌더링 영역 -->
        <div id="result-section" class="p-6 hidden-section bg-gray-50">
            <!-- Business Card Container -->
            <div id="businessCard" class="business-card relative w-full aspect-[1.5/1] sm:aspect-[1.6/1] rounded-xl overflow-hidden mb-6 bg-white flex">
                
                <!-- Dynamic Gradient Background -->
                <div id="cardBg" class="absolute inset-0 opacity-80"></div>
                
                <!-- Glassmorphism Overlay -->
                <!-- inset-3 으로 테두리 여백 확보 -->
                <div class="absolute inset-3 sm:inset-4 bg-white/80 backdrop-blur-sm rounded-lg flex flex-col justify-between p-4 sm:p-5 text-gray-800 border border-white/60 shadow-sm">
                    
                    <!-- Top: Date and Intro -->
                    <div class="flex justify-between items-start h-[40px]">
                        <div>
                            <!-- 영문 KOREAN NAME CARD 문구 삭제됨 -->
                            <p id="cardDate" class="text-xs sm:text-sm font-medium text-gray-600 mt-1">0월 0일생</p>
                        </div>
                        <div class="text-right w-1/2 max-w-[150px]">
                            <p class="text-[8px] sm:text-[9px] text-gray-400 mb-0.5">세종 어록</p>
                            <p id="cardQuote" class="serif text-[8.5px] sm:text-[10px] text-gray-500 italic word-keep-all leading-snug">
                                "백성이 나를 비판한 내용이 옳다면..."
                            </p>
                        </div>
                    </div>

                    <!-- Center: User Name & Korean Name -->
                    <div class="text-center flex-grow flex flex-col justify-center">
                        <h1 id="cardUserName" class="text-3xl sm:text-4xl font-black tracking-widest text-gray-900 mb-1 drop-shadow-sm leading-tight">홍길동</h1>
                        <h2 id="cardKoreanName" class="serif text-base sm:text-lg font-bold text-gray-700 word-keep-all leading-tight">
                            "함초롬한 미르"
                        </h2>
                    </div>

                    <!-- Bottom: Meaning -->
                    <div class="text-center mt-2 h-[45px] sm:h-[50px] flex items-end">
                        <div class="inline-block bg-white/90 rounded-lg px-2 sm:px-3 py-2 text-[10px] sm:text-[11px] text-gray-700 leading-tight shadow-sm w-full">
                            <p id="cardDescription">당신은 가지런하고 차분한 용 같은 사람입니다.</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Action Buttons: 저장 및 다시 만들기 -->
            <div class="flex gap-3">
                <button id="resetBtn" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 px-4 rounded-lg transition-colors shadow-sm">
                    다시 만들기
                </button>
                <button id="downloadBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    이미지 저장
                </button>
            </div>
        </div>
    </main>

    <script>
        // --- Data Definitions ---
        
        // 1. 오방색 매칭 조건 (이름 초성에 따른 색상 - 파스텔톤)
        const colorMap = {
            'ㅁ': '#FEF08A', 'ㅂ': '#FEF08A', 'ㅃ': '#FEF08A', 'ㅍ': '#FEF08A', // 은은한 노란색 (토)
            'ㅅ': '#F8FAFC', 'ㅆ': '#F8FAFC', 'ㅈ': '#F8FAFC', 'ㅉ': '#F8FAFC', 'ㅊ': '#F8FAFC', // 은은한 백색/연회색 (금)
            'ㄴ': '#FECACA', 'ㄷ': '#FECACA', 'ㄸ': '#FECACA', 'ㅌ': '#FECACA', 'ㄹ': '#FECACA', // 은은한 붉은색/코랄 (화)
            'ㄱ': '#BFDBFE', 'ㄲ': '#BFDBFE', 'ㅋ': '#BFDBFE', // 은은한 파란색/하늘색 (목)
            'ㅇ': '#94A3B8', 'ㅎ': '#94A3B8' // 은은한 검은색/슬레이트 그레이 (수)
        };

        // 2. 월별 순우리말 (형용사/동사)
        const monthData = {
            1: { word: "가령가령한", meaning: "깨끗하고 고운" },
            2: { word: "자늑자늑한", meaning: "동작이 가볍고 부드러운" },
            3: { word: "하분하분한", meaning: "연하고 무른" },
            4: { word: "포롱거리는", meaning: "가볍게 날아오르는" },
            5: { word: "곰살가운", meaning: "상냥하고 부드러운" },
            6: { word: "늘품있는", meaning: "앞으로 좋게 발전할" },
            7: { word: "말긋말긋한", meaning: "티 없이 맑고 환한" },
            8: { word: "덤부렁듬쑥한", meaning: "그윽하게 우거진" },
            9: { word: "소담한", meaning: "생김새가 탐스러운" },
            10: { word: "함초롬한", meaning: "가지런하고 차분한" },
            11: { word: "다붓한", meaning: "매우 가깝게 붙어 있는" },
            12: { word: "하르르한", meaning: "얇고 매우 보드라운" }
        };

        // 3. 일별 순우리말 (명사)
        const dayData = {
            1: { word: "가온", meaning: "세상의 중심" },
            2: { word: "나르샤", meaning: "날아오르는 모습" },
            3: { word: "다솜", meaning: "애틋한 사랑" },
            4: { word: "라온", meaning: "즐거움" },
            5: { word: "마루", meaning: "하늘" },
            6: { word: "바론", meaning: "올바름" },
            7: { word: "가시버시", meaning: "아내와 남편" },
            8: { word: "미르", meaning: "용" },
            9: { word: "샛별", meaning: "장래에 큰 발전을 이룰 사람" },
            10: { word: "아라", meaning: "바다" },
            11: { word: "윤슬", meaning: "잔물결" },
            12: { word: "미리내", meaning: "은하수" },
            13: { word: "단미", meaning: "사랑스러운 여자" },
            14: { word: "그린비", meaning: "그리운 사람" },
            15: { word: "아람", meaning: "가을 햇곡식" },
            16: { word: "도담", meaning: "탈 없이 자라는 모습" },
            17: { word: "해밀", meaning: "맑게 갠 하늘" },
            18: { word: "누리", meaning: "세상" },
            19: { word: "똘기", meaning: "아직 익지 않은 과일" },
            20: { word: "난야", meaning: "나지막한 들판" },
            21: { word: "달구리", meaning: "이른 새벽" },
            22: { word: "바라지", meaning: "작은 창" },
            23: { word: "설렁", meaning: "가볍게 부는 바람" },
            24: { word: "비나리", meaning: "앞길의 행복" },
            25: { word: "한울", meaning: "큰 우주" },
            26: { word: "예그리나", meaning: "사랑하는 사이" },
            27: { word: "아미", meaning: "눈썹" },
            28: { word: "별찌", meaning: "유성" },
            29: { word: "벗", meaning: "친구" },
            30: { word: "슬아", meaning: "슬기로움과 아름다움" },
            31: { word: "새론", meaning: "늘 새로운 사람" }
        };

        // 4. 세종 어록 (기존 + 추가하여 총 13개)
        const sejongQuotes = [
            "백성이 나를 비판한 내용이 옳다면 그것은 나의 잘못이니 처벌해서는 안 된다.",
            "내가 꿈꾸는 태평성대는 백성이 하려고 하는 일을 원만하게 하는 세상이다.",
            "진실로 차별 없이 만물을 다스려야 할 임금이 어찌 양민과 천민을 구별해서 다스릴 수 있겠는가.",
            "꽃이 지고 나면 잎이 보이듯이, 사람도 역경에 처해봐야 참모습을 알 수 있다.",
            "나랏말싸미 듕귁에 달아 문짜와로 서르 사맛디 아니할쎄...",
            "남을 너그럽게 받아들이는 사람은 항상 사람들의 마음을 얻게 된다.",
            "무릇 잘된 정치를 하려면 반드시 전대의 잘 다스려진 세상의 자취를 보아야 할 것이다.",
            "인재를 얻어 맡겼으면 의심하지 말고, 의심이 있으면 맡기지 말아야 한다.",
            "관직이란 내가 마음에 드는 사람을 앉히는 것이 아니다. 그 임무를 가장 잘해낼 사람을 택하는 것이다.",
            "농사는 천하의 근본이다. 백성이 먹고사는 것을 하늘처럼 여기게 하라.",
            "눈물을 흘리며 일하는 자의 고통을 덜어주는 것이 과인의 책무이다.",
            "뜻을 세움에는 반드시 높고 크게 해야 한다.",
            "임금이 할 일은 각기 다른 능력을 가진 이들을 제자리에 있게 하는 것이다."
        ];

        // DOM Elements
        const elName = document.getElementById('userName');
        const elMonth = document.getElementById('birthMonth');
        const elDay = document.getElementById('birthDay');
        const btnGenerate = document.getElementById('generateBtn');
        const btnReset = document.getElementById('resetBtn');
        const btnDownload = document.getElementById('downloadBtn');
        
        const sectionInput = document.getElementById('input-section');
        const sectionResult = document.getElementById('result-section');
        const businessCard = document.getElementById('businessCard');

        // Populate Select Options on load
        window.onload = () => {
            for(let i=1; i<=12; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.text = `${i}월`;
                elMonth.add(opt);
            }
            for(let i=1; i<=31; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.text = `${i}일`;
                elDay.add(opt);
            }
        };

        // 한글 초성 추출 및 색상 매칭 함수
        function getColorsFromName(name) {
            const chosungList = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let colors = [];
            
            for(let i = 0; i < name.length; i++) {
                const charCode = name.charCodeAt(i) - 44032;
                if(charCode > -1 && charCode < 11172) {
                    const chosungIndex = Math.floor(charCode / 588);
                    const chosung = chosungList[chosungIndex];
                    
                    if(colorMap[chosung]) {
                        if(!colors.includes(colorMap[chosung])) {
                            colors.push(colorMap[chosung]);
                        }
                    }
                }
            }
            
            // 색상이 매칭되지 않는 경우 기본값
            if (colors.length === 0) colors.push('#9CA3AF'); 
            return colors;
        }

        // 명함 생성 메인 함수
        function generateCard() {
            const name = elName.value.trim();
            const month = parseInt(elMonth.value);
            const day = parseInt(elDay.value);

            // 입력값 검증
            if(!name || isNaN(month) || isNaN(day)) {
                alert("이름과 생일을 모두 입력해주세요.");
                return;
            }

            // 1. 오방색 배경 처리
            const colors = getColorsFromName(name);
            const cardBg = document.getElementById('cardBg');
            
            if (colors.length === 1) {
                cardBg.style.background = `linear-gradient(135deg, ${colors[0]}, #FFFFFF)`;
            } else {
                cardBg.style.background = `linear-gradient(135deg, ${colors.join(', ')})`;
            }

            // 2. 순우리말 조합
            const mData = monthData[month];
            const dData = dayData[day] || {word: "사람", meaning: "특별한 의미를 지닌 사람"}; 
            
            // 텍스트 업데이트
            document.getElementById('cardDate').innerText = `${month}월 ${day}일생`;
            document.getElementById('cardKoreanName').innerText = `"${mData.word} ${dData.word}"`;
            
            // 자연스러운 뜻 풀이 HTML 조합
            document.getElementById('cardDescription').innerHTML = 
                `<span class="font-bold text-gray-800">당신은 ${mData.meaning} ${dData.meaning} 같은 사람입니다.</span><br>
                 <span class="text-[8.5px] sm:text-[9.5px] text-gray-500 mt-1 block font-normal">
                    * ${mData.word}: ${mData.meaning} &nbsp;|&nbsp; * ${dData.word}: ${dData.meaning}
                 </span>`;

            // 3. 이름 및 세종어록 셋팅
            document.getElementById('cardUserName').innerText = name;
            // 어록 무작위 선택
            const randomQuote = sejongQuotes[Math.floor(Math.random() * sejongQuotes.length)];
            document.getElementById('cardQuote').innerText = `"${randomQuote}"`;

            // 4. 화면 전환
            sectionInput.classList.add('hidden-section');
            sectionResult.classList.remove('hidden-section');
        }

        // --- Event Listeners ---
        btnGenerate.addEventListener('click', generateCard);
        
        btnReset.addEventListener('click', () => {
            elName.value = '';
            elMonth.value = '';
            elDay.value = '';
            sectionResult.classList.add('hidden-section');
            sectionInput.classList.remove('hidden-section');
        });

        // 이미지 다운로드 기능 (html2canvas 활용)
        btnDownload.addEventListener('click', () => {
            const originalText = btnDownload.innerHTML;
            btnDownload.innerHTML = '저장 중...';
            btnDownload.disabled = true;

            html2canvas(businessCard, {
                scale: 3, // 고해상도 캡처
                useCORS: true,
                backgroundColor: null // 둥근 테두리 밖 배경 투명 처리
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${elName.value}님의_명함.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // 버튼 상태 원복
                btnDownload.innerHTML = originalText;
                btnDownload.disabled = false;
            }).catch(err => {
                console.error("이미지 저장 실패", err);
                alert("이미지를 저장하는 중 문제가 발생했습니다.");
                btnDownload.innerHTML = originalText;
                btnDownload.disabled = false;
            });
        });
    </script>
</body>
</html>
